kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: relay
nodes:
  - role: control-plane
    extraPortMappings:
      # http://localhost:8080 on your machine reaches the relay NodePort
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
    labels:
      topology.kubernetes.io/zone: local-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: local-b
