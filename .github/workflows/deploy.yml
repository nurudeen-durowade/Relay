name: deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-west-1
  ECR_REPO: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/relay

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - uses: aws-actions/configure-aws-credentials@master
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REPO

      - name: Build and push
        run: |
          docker build -t $ECR_REPO:latest app
          docker push $ECR_REPO:latest

      - name: Deploy to production
        run: |
          aws eks update-kubeconfig --name relay-prod
          kubectl apply -f k8s/
          kubectl -n relay rollout restart deployment/relay
